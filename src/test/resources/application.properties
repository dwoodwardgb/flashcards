# Test configuration - uses in-memory SQLite database
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Let Hibernate create the schema for tests (since Flyway migrations may not work with in-memory)
# spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=true
flyway.baselineOnMigrate=true
flyway.validateMigrationNaming=true

# Show SQL for debugging tests (optional - can be set to false)
spring.jpa.show-sql=false

