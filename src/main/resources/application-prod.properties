# Production profile overrides
# Activate with: --spring.profiles.active=prod
server.port=8080

# Performance: enable template caching
spring.thymeleaf.cache=true

# Hide internal mappings in production
spring.mappings.show=false

# Restrict actuator endpoints (health only, no sensitive info)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Database URL from environment variable (required in production)
spring.datasource.url=jdbc:sqlite:${DATABASE_URL}

audio.files.url-prefix=${AUDIO_FILES_DIR}
audio.files.directory=${AUDIO_FILES_DIR}
tts-gapi-key-path=${TTS_GAPI_KEY}
