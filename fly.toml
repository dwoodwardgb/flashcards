# fly.toml app configuration file generated for flashcards-spring-violet-2228 on 2024-08-19T11:56:38-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flashcards-spring-violet-2228'
primary_region = 'ord'

[build]

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[env]
HOST = '0.0.0.0'
PORT = '8080'
TZ = 'UTC'
LOG_LEVEL = 'info'
NODE_ENV = 'production'
SESSION_DRIVER = 'cookie'
DATABASE_URL = "/mnt/data/production.sqlite3"

[mounts]
source = "data"
destination = "/mnt/data"
