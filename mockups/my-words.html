<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Words - Dictionary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            overflow: hidden;
        }

        /* Desktop wrapper */
        @media (min-width: 768px) {
            body {
                align-items: center;
                justify-content: center;
                background: #e8e8e8;
            }

            .app-container {
                width: 100%;
                max-width: 480px;
                height: 90vh;
                max-height: 800px;
                display: flex;
                flex-direction: column;
                background: white;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .word-count {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 500;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .filter-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 6px 14px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .words-list {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: white;
        }

        .section-header {
            padding: 12px 20px 8px;
            background: #f8f8f8;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .word-item {
            border-bottom: 1px solid #f0f0f0;
            padding: 14px 20px;
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
            position: relative;
        }

        .word-item:active {
            background: #f8f9fa;
        }

        .word-item.swipe-left {
            transform: translateX(-80px);
        }

        .delete-action {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .word-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lang-line {
            display: grid;
            grid-template-columns: 20px 1fr;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .lang-flag {
            font-size: 14px;
        }

        .word-text {
            color: #333;
        }

        /* Alphabet scrubber */
        .alphabet-nav {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 2;
        }

        .alphabet-letter {
            font-size: 10px;
            font-weight: 600;
            color: #667eea;
            padding: 2px 6px;
            cursor: pointer;
        }

        .alphabet-letter.active {
            background: #667eea;
            color: white;
            border-radius: 4px;
        }

        /* Floating add button */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            z-index: 10;
        }

        .fab:active {
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: #aaa;
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @supports (padding: max(0px)) {
            .header {
                padding-top: max(16px, env(safe-area-inset-top));
            }
            .fab {
                bottom: max(24px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
    <div class="header">
        <div class="header-top">
            <h1>My Words</h1>
            <span class="word-count">47 words</span>
        </div>
        <div class="filter-chips">
            <div class="chip active">A-Z</div>
            <div class="chip">Recent</div>
            <div class="chip">Most Used</div>
            <div class="chip">By Language</div>
        </div>
    </div>

    <div class="content-area">
        <div class="words-list">
            <!-- Section A -->
            <div class="section-header">A</div>

            <div class="word-item">
                <div class="word-row">
                    <div class="lang-line">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="word-text">Apple</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="word-text">Manzana</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇫🇷</span>
                        <span class="word-text">Pomme</span>
                    </div>
                </div>
                <div class="delete-action">🗑️</div>
            </div>

            <!-- Section B -->
            <div class="section-header">B</div>

            <div class="word-item">
                <div class="word-row">
                    <div class="lang-line">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="word-text">Book</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="word-text">Libro</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇫🇷</span>
                        <span class="word-text">Livre</span>
                    </div>
                </div>
                <div class="delete-action">🗑️</div>
            </div>

            <div class="word-item">
                <div class="word-row">
                    <div class="lang-line">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="word-text">Bread</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="word-text">Pan</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇫🇷</span>
                        <span class="word-text">Pain</span>
                    </div>
                </div>
                <div class="delete-action">🗑️</div>
            </div>

            <!-- Section H -->
            <div class="section-header">H</div>

            <div class="word-item">
                <div class="word-row">
                    <div class="lang-line">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="word-text">Hello</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="word-text">Hola</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇫🇷</span>
                        <span class="word-text">Bonjour</span>
                    </div>
                </div>
                <div class="delete-action">🗑️</div>
            </div>

            <div class="word-item">
                <div class="word-row">
                    <div class="lang-line">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="word-text">House</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="word-text">Casa</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇫🇷</span>
                        <span class="word-text">Maison</span>
                    </div>
                </div>
                <div class="delete-action">🗑️</div>
            </div>

            <!-- Section W -->
            <div class="section-header">W</div>

            <div class="word-item">
                <div class="word-row">
                    <div class="lang-line">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="word-text">Water</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="word-text">Agua</span>
                    </div>
                    <div class="lang-line">
                        <span class="lang-flag">🇫🇷</span>
                        <span class="word-text">Eau</span>
                    </div>
                </div>
                <div class="delete-action">🗑️</div>
            </div>
        </div>

        <!-- Alphabet scrubber -->
        <div class="alphabet-nav">
            <div class="alphabet-letter active">A</div>
            <div class="alphabet-letter">B</div>
            <div class="alphabet-letter">C</div>
            <div class="alphabet-letter">D</div>
            <div class="alphabet-letter">E</div>
            <div class="alphabet-letter">F</div>
            <div class="alphabet-letter">G</div>
            <div class="alphabet-letter">H</div>
            <div class="alphabet-letter">I</div>
            <div class="alphabet-letter">J</div>
            <div class="alphabet-letter">K</div>
            <div class="alphabet-letter">L</div>
            <div class="alphabet-letter">M</div>
            <div class="alphabet-letter">N</div>
            <div class="alphabet-letter">O</div>
            <div class="alphabet-letter">P</div>
            <div class="alphabet-letter">Q</div>
            <div class="alphabet-letter">R</div>
            <div class="alphabet-letter">S</div>
            <div class="alphabet-letter">T</div>
            <div class="alphabet-letter">U</div>
            <div class="alphabet-letter">V</div>
            <div class="alphabet-letter">W</div>
            <div class="alphabet-letter">X</div>
            <div class="alphabet-letter">Y</div>
            <div class="alphabet-letter">Z</div>
        </div>
    </div>

    <!-- Floating Add Button -->
    <div class="fab">+</div>

    <script>
        const wordItems = document.querySelectorAll('.word-item');
        const fab = document.querySelector('.fab');
        const chips = document.querySelectorAll('.chip');
        const alphabetLetters = document.querySelectorAll('.alphabet-letter');

        // Swipe to delete
        let touchStartX = 0;
        let currentItem = null;

        wordItems.forEach(item => {
            item.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                currentItem = item;
            });

            item.addEventListener('touchmove', (e) => {
                const touchX = e.touches[0].clientX;
                const diff = touchStartX - touchX;

                if (diff > 50) {
                    item.classList.add('swipe-left');
                } else if (diff < -20) {
                    item.classList.remove('swipe-left');
                }
            });

            item.addEventListener('touchend', () => {
                if (!item.classList.contains('swipe-left')) {
                    // Tap to edit
                    setTimeout(() => {
                        alert('Edit word');
                    }, 50);
                }
            });

            // Click delete button
            const deleteBtn = item.querySelector('.delete-action');
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Delete this word?')) {
                    item.style.display = 'none';
                }
            });
        });

        // Filter chips
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });

        // Alphabet navigation
        alphabetLetters.forEach(letter => {
            letter.addEventListener('click', () => {
                alphabetLetters.forEach(l => l.classList.remove('active'));
                letter.classList.add('active');

                // Scroll to section
                const sectionHeader = Array.from(document.querySelectorAll('.section-header'))
                    .find(h => h.textContent === letter.textContent);
                if (sectionHeader) {
                    sectionHeader.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // FAB click
        fab.addEventListener('click', () => {
            alert('Add new word');
        });
    </script>
    </div>
</body>
</html>
